apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if not .Values.api.rollout.enabled }}
---
# Plain rolling update. With api.rollout.enabled the Rollout in api-rollout.yaml replaces this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    {{- include "tasks.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: api }
  template:
    {{- include "tasks.apiPodTemplate" . | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    {{- include "tasks.labels" . | nindent 4 }}
spec:
  selector: { app: api }
  ports:
    - name: http
      port: 3000
      targetPort: http
