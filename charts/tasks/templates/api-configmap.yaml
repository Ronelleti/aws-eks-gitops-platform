# Non-secret API settings. The password comes from the credentials Secret, never from here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_SSL: {{ .Values.database.ssl | quote }}
  LOG_LEVEL: {{ .Values.api.logLevel | quote }}
  APP_ENV: {{ .Values.appEnv | quote }}
  S3_BUCKET: {{ .Values.api.s3Bucket | quote }}
  AWS_REGION: {{ .Values.awsRegion | quote }}
  ENABLE_DEMO: {{ .Values.api.enableDemo | quote }}
  MAX_UPLOAD_BYTES: {{ mul .Values.api.maxUploadMb 1048576 | quote }}
  {{- with .Values.queue.url }}
  QUEUE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.queue.dlqUrl }}
  DLQ_URL: {{ . | quote }}
  {{- end }}
