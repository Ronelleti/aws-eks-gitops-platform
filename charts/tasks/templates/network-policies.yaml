{{- if .Values.networkPolicies.enabled }}
# Deny all incoming traffic, then allow only: ingress controller -> ui -> api -> postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-from-ingress-controller
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: ui }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressControllerNamespace }}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-ui
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: api }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: ui }
      ports:
        - port: 3000
{{- if .Values.monitoring.enabled }}
---
# Let Prometheus scrape the API's /metrics endpoint
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-prometheus
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: api }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
      ports:
        - port: 3000
{{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-api
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: postgres }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: api }
      ports:
        - port: 5432
{{- end }}
{{- end }}
