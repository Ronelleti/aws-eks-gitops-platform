{{- if .Values.monitoring.enabled }}
# Tells Prometheus to scrape the api Service's /metrics every 15s
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tasks-api
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app: api }
  # adds the label rollouts_pod_template_hash to every metric: it tells old pods from canary pods
  podTargetLabels:
    - rollouts-pod-template-hash
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- if .Values.monitoring.alerts }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tasks-api
  labels:
    {{- include "tasks.labels" . | nindent 4 }}
spec:
  groups:
    - name: tasks-api
      rules:
        - alert: TasksApiNoReadyPods
          expr: sum(kube_pod_status_ready{namespace="{{ .Release.Namespace }}", pod=~"api-.*", condition="true"}) < 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: No API pod is ready - the app cannot serve requests
            runbook: Check the database (kubectl get pods), then the API logs and /readyz
        - alert: TasksApiHighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="{{ .Release.Namespace }}", route!~"/healthz|/readyz|/metrics", status=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count{namespace="{{ .Release.Namespace }}", route!~"/healthz|/readyz|/metrics"}[5m])) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: More than 5% of API requests fail with a 5xx error
        - alert: TasksApiSlowDatabase
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(db_query_duration_seconds_bucket{namespace="{{ .Release.Namespace }}"}[5m]))) > 0.25
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: Database queries from the API take more than 250 ms at the 95th percentile
        - alert: TasksApiRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", pod=~"api-.*"}[15m]) > 3
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: An API container restarted more than 3 times in 15 minutes
        - alert: TasksApiHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}", route!~"/healthz|/readyz|/metrics"}[5m]))) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: API p95 latency is above 1 second
{{- if and .Values.worker.enabled .Values.queue.url }}
    - name: tasks-worker
      rules:
        - alert: TasksWorkerNotReady
          expr: sum(kube_pod_status_ready{namespace="{{ .Release.Namespace }}", pod=~"worker-.*", condition="true"}) < 1
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: No worker pod is ready - background jobs are piling up in the queue
            runbook: kubectl get pods -n {{ .Release.Namespace }} -l app=worker, then kubectl logs deploy/worker
        - alert: TasksQueueBacklog
          expr: max(queue_messages{namespace="{{ .Release.Namespace }}", queue="jobs", state="visible"}) > 50
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: More than 50 jobs have been waiting in the queue for 10 minutes
        - alert: TasksJobsFailing
          expr: sum(increase(worker_jobs_total{namespace="{{ .Release.Namespace }}", result="failed"}[10m])) > 5
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: The worker failed more than 5 jobs in 10 minutes
        - alert: TasksDeadLetterQueueNotEmpty
          expr: max(queue_messages{namespace="{{ .Release.Namespace }}", queue="dlq", state="visible"}) > 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: Jobs failed three times and were parked in the dead-letter queue
            runbook: Read the worker logs for the reason, fix it, then move the messages back (SQS console - Start DLQ redrive)
{{- end }}
{{- end }}
{{- if .Values.monitoring.dashboards }}
---
# Grafana's sidecar loads every ConfigMap labeled grafana_dashboard=1 as a dashboard.
# The JSON lives in dashboards/ and is read with .Files.Get, so its legend templates are not parsed by Helm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tasks-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "tasks.labels" . | nindent 4 }}
data:
  tasks-app.json: |-
{{ .Files.Get "dashboards/tasks-app.json" | indent 4 }}
{{- end }}
{{- end }}
