apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.targetSecretName }}
    creationPolicy: Owner
  data:
    # the RDS-managed secret is JSON: {"username": "...", "password": "..."}
    - secretKey: username
      remoteRef:
        key: {{ required "secretArn is required" .Values.secretArn }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.secretArn }}
        property: password
