# No credentials here on purpose: the External Secrets controller gets AWS access through
# EKS Pod Identity, so the store uses the default credential chain.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region | quote }}
