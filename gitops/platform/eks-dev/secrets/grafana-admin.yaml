# Grafana's login. AWS generated the password (Terraform, infra/dev/secrets.tf); this copies it into the
# Kubernetes Secret that the Grafana chart reads. The ClusterSecretStore is created by Terraform.
# The secret's name is aws-eks-gitops-platform/dev/grafana-admin; if you change the project or environment
# variables in infra/dev, change it here too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: aws-eks-gitops-platform/dev/grafana-admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: aws-eks-gitops-platform/dev/grafana-admin
        property: admin-password
