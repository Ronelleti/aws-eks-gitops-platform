# Runs once, after Elasticsearch and Kibana are synced, so nobody has to click through a setup screen:
#   1. an index template: no replicas (one node cannot hold a copy, so the cluster would stay yellow), and every field
#      named "level" is a keyword. The API logs level as a number (30) and other apps as text ("info"); Elasticsearch
#      rejects the second kind it sees unless the field is a keyword, which accepts both.
#   2. a Kibana data view over kube-*, so Discover opens straight onto the logs
# The Job waits for both services itself, because Argo CD has no way to know when an operator-managed database is ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: logging-setup
  namespace: logging
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
      containers:
        - name: setup
          image: curlimages/curl:8.11.1
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef: { name: logging-es-elastic-user, key: elastic }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              ES=https://logging-es-http.logging.svc:9200
              KB=https://logging-kb-http.logging.svc:5601
              AUTH="elastic:${ELASTIC_PASSWORD}"
              # -k: these services use certificates from the cluster's own CA, which this tiny job does not need to trust

              until curl -sk -u "$AUTH" "$ES/_cluster/health?wait_for_status=yellow&timeout=10s" | grep -Eq '"status" *:'; do
                echo "waiting for Elasticsearch"; sleep 10
              done
              curl -sSk -u "$AUTH" -X PUT "$ES/_index_template/kube-logs" -H 'Content-Type: application/json' \
                -d '{"index_patterns":["kube-*"],"template":{"settings":{"number_of_replicas":0},"mappings":{"dynamic_templates":[{"levels_as_keywords":{"match":"level","mapping":{"type":"keyword"}}}]}}}'
              echo

              until curl -sk -u "$AUTH" "$KB/api/status" | grep -Eq '"level" *: *"available"'; do
                echo "waiting for Kibana"; sleep 10
              done
              curl -sSk -u "$AUTH" -X POST "$KB/api/data_views/data_view" \
                -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
                -d '{"override":true,"data_view":{"title":"kube-*","name":"Kubernetes logs","timeFieldName":"@timestamp","allowNoIndex":true}}'
              echo
              echo "logging setup done"
