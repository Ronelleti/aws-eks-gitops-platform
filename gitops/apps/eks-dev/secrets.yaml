# ExternalSecrets that copy logins from AWS Secrets Manager into Kubernetes (Grafana's admin login).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # lower numbers are applied first; retries cover anything that still arrives too early
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ronelleti/aws-eks-gitops-platform.git
    targetRevision: main
    path: gitops/platform/eks-dev/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
