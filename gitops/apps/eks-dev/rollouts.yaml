# Argo Rollouts: the controller that runs canary releases (the Rollout in charts/tasks/templates/api-rollout.yaml).
# It must exist before the tasks app creates a Rollout; the tasks app retries until the CRDs appear.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: "2.43.6"
    helm:
      releaseName: argo-rollouts
      valuesObject:
        controller:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the Rollout CRD is large
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
