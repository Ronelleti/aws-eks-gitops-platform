# EKS dev environment. More values (RDS host, IRSA role, ALB ingress) are added with infra/dev.
# The image tags below are updated automatically by the app-ci workflow - don't edit them by hand.
appEnv: eks-dev
api:
  rollout:
    enabled: true   # canary releases with automatic rollback (Argo Rollouts, see gitops/apps/eks-dev/rollouts.yaml)
  image:
    repository: 508193318669.dkr.ecr.eu-north-1.amazonaws.com/tasks-api
    tag: "097c923dd0364f4c6e337b772ed84b1e04a25ce9"
ui:
  image:
    repository: 508193318669.dkr.ecr.eu-north-1.amazonaws.com/tasks-ui
    tag: "097c923dd0364f4c6e337b772ed84b1e04a25ce9"
# the database is RDS in AWS, not a pod
postgres:
  enabled: false
