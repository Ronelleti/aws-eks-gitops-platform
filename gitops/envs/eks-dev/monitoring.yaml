# kube-prometheus-stack for the EKS dev cluster. Reached with kubectl port-forward (scripts/eks-open.sh),
# never from the internet: this environment has no HTTPS, and Grafana has a login.

# EKS runs the control plane for you and does not expose these components, so scraping them would only produce
# "target down" noise, and their default alerts ("scheduler is down") would fire forever.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    # pick up ServiceMonitors and PrometheusRules from ALL namespaces (the tasks chart ships its own)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 1d              # the environment lives for hours, not weeks
    retentionSize: 4GB         # stop before the 10Gi disk fills
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1536Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

# Alertmanager groups the alerts Prometheus raises and emails them through the SNS topic from infra/global
# (the same topic as the budget and cost-watchdog emails; the address was confirmed once, see README step 4b).
# AWS credentials come from EKS Pod Identity: infra/dev/alerting.tf ties the role to the service account named below.
alertmanager:
  enabled: true
  serviceAccount:
    create: true
    name: alertmanager
  alertmanagerSpec:
    replicas: 1                 # a lab: one replica, no disk (an alert that was already sent may be sent once more after a restart)
    retention: 24h
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 128Mi }
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      # a critical alert silences the warning of the same name in the same namespace (one email, not two)
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      receiver: 'null'          # anything not matched below goes nowhere: only warnings and criticals are emailed
      group_by: ['alertname', 'namespace']
      group_wait: 30s           # wait a little so alerts that start together arrive in one email
      group_interval: 5m
      repeat_interval: 12h      # a problem that lasts is mentioned again every 12 hours
      routes:
        - receiver: 'null'
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']   # Watchdog fires all the time on purpose (proves the pipeline is alive)
        - receiver: sns
          matchers: ['severity =~ "warning|critical"']
    receivers:
      - name: 'null'
      - name: sns
        sns_configs:
          - topic_arn: arn:aws:sns:eu-north-1:508193318669:aws-eks-gitops-platform-alerts   # created by infra/global (not a secret)
            sigv4:
              region: eu-north-1      # no keys: the SDK takes the Pod Identity credentials
            send_resolved: true
            subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            message: |-
              {{ range .Alerts }}{{ .Labels.severity | toUpper }} - {{ .Annotations.summary }}
              {{ if .Annotations.description }}{{ .Annotations.description }}
              {{ end }}alert: {{ .Labels.alertname }}   namespace: {{ .Labels.namespace }}
              {{ if .Annotations.runbook }}what to do: {{ .Annotations.runbook }}
              {{ end }}
              {{ end }}

grafana:
  # the login comes from AWS Secrets Manager through External Secrets (gitops/platform/eks-dev/secrets)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    plugins:
      preinstall_disabled: true   # do not download plugins from the internet at startup; Prometheus is built in
  sidecar:
    dashboards:
      searchNamespace: ALL        # load dashboards from ConfigMaps in any namespace (the tasks chart ships one)
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }
