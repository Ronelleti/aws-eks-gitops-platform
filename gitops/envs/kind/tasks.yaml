# kind (local) environment. Only what differs from charts/tasks/values.yaml.
# To deploy a new version: change a tag here, commit, push. ArgoCD does the rest.
appEnv: kind

api:
  image:
    tag: "0.1.1"

ui:
  replicas: 3
  image:
    tag: "0.1.0"

networkPolicies:
  enabled: true

monitoring:
  enabled: true