apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: tasks
  labels: { app: ui }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: ui }
  template:
    metadata:
      labels: { app: ui }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101           # nginx user in the unprivileged image
      containers:
        - name: ui
          image: tasks-ui:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: ui-config }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: tasks
spec:
  selector: { app: ui }
  ports:
    - name: http
      port: 80
      targetPort: http
