# Scale the API between 2 and 5 pods based on CPU (needs metrics-server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: tasks
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
# During node drains/upgrades, always keep at least one API pod running
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: tasks
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
