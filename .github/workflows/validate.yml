# Checks for the parts that aren't app code: Helm chart and Terraform.
# No AWS access needed, so it also runs safely on pull requests.
name: validate

on:
  push:
    branches: [main]
    paths: ["charts/**", "gitops/**", "infra/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["charts/**", "gitops/**", "infra/**", ".github/workflows/validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint the chart with every environment's values
        run: |
          for env in gitops/envs/*/; do
            echo "== $env"
            args=""
            for f in "$env"*.yaml; do args="$args -f $f"; done
            # shellcheck disable=SC2086
            helm lint charts/tasks $args
          done
      - name: Render the worker, its monitoring and its alerts
        # They only exist when a queue address is set (Terraform injects it on EKS), so the loop above never renders them.
        run: |
          set -e
          args="-f gitops/envs/eks-dev/config.yaml -f gitops/envs/eks-dev/tasks.yaml"
          args="$args --set queue.url=https://sqs.eu-north-1.amazonaws.com/000000000000/example-jobs"
          args="$args --set queue.dlqUrl=https://sqs.eu-north-1.amazonaws.com/000000000000/example-jobs-dlq"
          args="$args --set database.host=db.example --set api.s3Bucket=example"
          # shellcheck disable=SC2086
          helm lint charts/tasks $args
          # shellcheck disable=SC2086
          helm template tasks charts/tasks $args > /tmp/rendered.yaml
          for expected in "name: worker" "kind: PodMonitor" "alert: TasksDeadLetterQueueNotEmpty" "QUEUE_URL"; do
            grep -q "$expected" /tmp/rendered.yaml || { echo "missing from the rendered chart: $expected"; exit 1; }
          done
      - name: Lint the db-secret chart
        run: helm lint charts/db-secret --set secretArn=arn:aws:secretsmanager:eu-north-1:000000000000:secret:example

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive infra
      - name: Validate each root module (no backend, no AWS access)
        run: |
          for dir in infra/*/; do
            [ -f "$dir/versions.tf" ] || continue
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done