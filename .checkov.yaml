# Checkov: security scan of Terraform, Dockerfiles and GitHub Actions workflows.
# Run by .github/workflows/security.yml. Locally:  pip install checkov && checkov --config-file .checkov.yaml
#
# Every skip below is a decision, with the reason next to it. A NEW finding fails the build.
directory:
  - .
framework:
  - terraform
  - dockerfile
  - github_actions
quiet: true
compact: true
skip-check:
  # ---- Costs money, and this is a lab that is destroyed after every session ----
  - CKV_AWS_157  # RDS Multi-AZ: doubles the database price
  - CKV_AWS_293  # RDS deletion protection: would block `terraform destroy`
  - CKV_AWS_338  # log retention of 1 year: logs are kept 7 days on purpose
  - CKV_AWS_353  # RDS Performance Insights
  - CKV_AWS_118  # RDS enhanced monitoring
  - CKV2_AWS_30  # RDS query logging
  - CKV_AWS_144  # S3 cross-region replication
  - CKV_AWS_18   # S3 access logging (needs a second bucket)
  - CKV_AWS_21   # S3 versioning: the bucket is deleted with the environment
  - CKV2_AWS_61  # S3 lifecycle rules: the bucket is deleted with the environment
  - CKV2_AWS_62  # S3 event notifications: not used
  - CKV2_AWS_11  # VPC flow logs
  - CKV2_AWS_57  # Secrets Manager rotation: the Grafana password is recreated on every build
  # ---- Customer-managed KMS keys: $1 per key per month; AWS-managed encryption is already on ----
  - CKV_AWS_145  # S3 encrypted with a KMS key
  - CKV_AWS_136  # ECR encrypted with a KMS key
  - CKV_AWS_149  # Secrets Manager encrypted with a KMS key
  - CKV_AWS_158  # CloudWatch log groups encrypted with a KMS key
  - CKV_AWS_173  # Lambda environment variables encrypted with a KMS key (they hold no secrets)
  # ---- This account's limits, or a deliberate design ----
  - CKV_AWS_130  # public subnets hand out public IPs: there is no NAT gateway (saves $33/month)
  - CKV_AWS_273  # IAM user instead of SSO: the account's SCP blocks the OIDC provider
  - CKV_AWS_40   # same: the CI user has its policy attached directly
  - CKV_AWS_161  # RDS IAM authentication: the app uses the managed password from Secrets Manager
  - CKV_AWS_26   # SNS encryption: AWS Budgets cannot publish to a topic that uses the AWS-managed key
  - CKV_TF_1     # module commit hashes: modules are pinned by exact version instead
  - CKV_AWS_394  # availability-zone pinning: informational
  # ---- Cost watchdog Lambda: a small hourly read-only job ----
  - CKV_AWS_115  # reserved concurrency: a new account's limit can make a reservation fail
  - CKV_AWS_116  # dead-letter queue: it runs again next hour anyway
  - CKV_AWS_117  # inside a VPC: would need a NAT gateway or endpoints to reach AWS APIs
  - CKV_AWS_50   # X-Ray tracing
  - CKV_AWS_272  # code signing
  - CKV_AWS_356  # "*" resource: eks:List*, eks:Describe* and rds:Describe* cannot be limited to one resource
  # ---- Containers ----
  - CKV_DOCKER_2 # HEALTHCHECK: Kubernetes liveness and readiness probes do this job
  - CKV_DOCKER_3 # ui image: the nginx-unprivileged base image already runs as a non-root user
