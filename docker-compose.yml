# Local development: Postgres + API + UI
# Run first:  . .\scripts\local-env.ps1   (loads DB_PASSWORD from AWS Secrets Manager)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run . .\scripts\local-env.ps1 first}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?Run . .\scripts\local-env.ps1 first}
      LOG_LEVEL: debug
      APP_ENV: local
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./apps/ui
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  db-data:
