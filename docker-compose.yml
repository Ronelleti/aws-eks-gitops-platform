# Local development: Postgres + API + UI
# Run first:  . .\scripts\local-env.ps1   (loads DB_PASSWORD from AWS Secrets Manager)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run . .\scripts\local-env.ps1 first}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 5433 on the host, so it never clashes with a Postgres you already run on 5432.
      # 127.0.0.1 keeps it off the network: only this computer can connect (psql -h localhost -p 5433).
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?Run . .\scripts\local-env.ps1 first}
      LOG_LEVEL: debug
      APP_ENV: local
    ports:
      # Change a port without editing this file:  API_PORT=3001 UI_PORT=8081 PG_PORT=5434 docker compose up --build
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./apps/ui
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "127.0.0.1:${UI_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  db-data: